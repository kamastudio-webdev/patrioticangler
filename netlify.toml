[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Send www to the main address.
[[redirects]]
  from = "https://www.patrioticangler.com/*"
  to = "https://patrioticangler.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.patrioticangler.com/*"
  to = "https://patrioticangler.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
